name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Vérification de la version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' upsidly-agent.php | awk '{print $NF}')
          CONSTANT=$(grep -m1 "define( 'UPSIDLY_AGENT_VERSION'" upsidly-agent.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          echo "Tag $TAG, en-tête $HEADER, constante $CONSTANT"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONSTANT"

      - name: ZIP upsidly-agent.zip
        run: |
          mkdir -p dist/upsidly-agent
          rsync -a --exclude-from=.distignore ./ dist/upsidly-agent/
          cd dist && zip -qr upsidly-agent.zip upsidly-agent
          unzip -l upsidly-agent.zip | tail -1

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/upsidly-agent.zip
          generate_release_notes: true
