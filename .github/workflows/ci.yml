name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wp: '6.4'
          - php: '8.3'
            wp: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer:v2
          coverage: none

      - name: Subversion (suite de tests WordPress)
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion

      - name: Dépendances Composer
        run: composer install --no-interaction --no-progress

      - name: Installation de WordPress et de la suite de tests
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Extensions de test (WooCommerce, ACF)
        if: matrix.wp == 'latest'
        run: |
          for p in woocommerce advanced-custom-fields; do
            curl -fsSL "https://downloads.wordpress.org/plugin/$p.latest-stable.zip" -o "/tmp/$p.zip"
            unzip -q "/tmp/$p.zip" -d /tmp/wordpress/wp-content/plugins/
          done
          echo "UPSIDLY_TEST_PLUGINS=1" >> "$GITHUB_ENV"

      - name: PHPUnit
        run: |
          set +e
          vendor/bin/phpunit 2>&1 | tee phpunit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Résumé des échecs en annotation (lisible sans droits d'administration).
            summary=$(grep -vE '^\s*$' phpunit.log | tail -n 60 | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=PHPUnit::${summary}"
          fi
          exit "$status"

  lint:
    name: phpcs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Dépendances
        run: composer install --no-interaction --no-progress

      - name: phpcs (WordPress Coding Standards)
        run: vendor/bin/phpcs

      - name: Syntaxe PHP 8.0
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.0-cli sh -c \
            'find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l > /dev/null'
